workflows:
  ios-build:
    name: iOS Build (pachi回転計 signed, TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # 👑 Codemagic の Team settings > Integrations > App Store Connect に
      # 登録済みの App Store Connect API キー統合(Admin権限 / 統合名: CodemagicAdmin)。
      # ハナジャグと同じ統合を共用(同一 Apple アカウントの場合)。
      app_store_connect: CodemagicAdmin
    environment:
      ios_signing:
        # 手動コードサイニング。Codemagic の Team settings > Code signing identities に
        # アップロード済みの署名ファイルを「参照名」で指定する。
        certificates:
          # 配布証明書(Apple Distribution)はアカウント単位で共通のため、
          # ハナジャグと同一 Apple チームなら既存の証明書を再利用する。
          # ※p12 は OpenSSL 3 の既定だと Apple バリデータに弾かれるため、
          #   `openssl pkcs12 -export -legacy` で再エクスポートしたものを登録すること。
          - ios_distribution_cert
        provisioning_profiles:
          # com.pachikaiten.pachikaiten 用の App Store プロビジョニングプロファイルを
          # この参照名で新規アップロードする(ハナジャグ用とは別物)。
          - ios_appstore_profile_pachikaiten
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Resolve build number (TestFlight auto-increment)
        script: |
          #!/usr/bin/env sh
          set -e
          # フォールバック用: pubspec の version: x.y.z+BUILD の +BUILD 部分。
          PUBSPEC_BUILD=$(grep '^version:' pubspec.yaml | head -1 | sed 's/.*+//' | tr -d '[:space:]')
          BUILD_NUMBER="$PUBSPEC_BUILD"
          # APP_STORE_APP_ID(アプリの数値 Apple ID)が設定されていれば TestFlight の
          # 最新ビルド番号+1 を自動採番。未設定/取得失敗/新規アプリ(既存ビルドなし)は
          # pubspec のビルド番号にフォールバックする(=従来動作。安全に通る)。
          if [ -n "$APP_STORE_APP_ID" ]; then
            set +e
            LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" 2>/tmp/asc_err.log)
            RC=$?
            set -e
            if [ "$RC" -eq 0 ] && [ -n "$LATEST" ]; then
              BUILD_NUMBER=$((LATEST + 1))
              echo "TestFlight 最新ビルド番号=$LATEST → 採番=$BUILD_NUMBER"
            elif [ "$RC" -eq 0 ]; then
              echo "既存ビルドなし(新規アプリ)。pubspec のビルド番号=$BUILD_NUMBER を使用。"
            else
              echo "WARN: 最新ビルド番号の取得に失敗(rc=$RC)。pubspec の $BUILD_NUMBER にフォールバック。"
              cat /tmp/asc_err.log 2>/dev/null || true
            fi
          else
            echo "APP_STORE_APP_ID 未設定 → 自動採番スキップ。pubspec のビルド番号=$BUILD_NUMBER を使用。"
          fi
          echo "$BUILD_NUMBER" > /tmp/build_number.txt
          echo "採用ビルド番号: $BUILD_NUMBER"
      - name: Build signed iOS IPA
        script: |
          flutter build ipa --release \
            --build-number="$(cat /tmp/build_number.txt)" \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
